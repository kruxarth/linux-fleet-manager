<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fleet Manager, explained from zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E4ECF8; --ink:#1F2A44; --soft:#5C6B8A; --paper:#FFFFFF;
  --sun:#FFC94D; --leaf:#1F9D63; --rose:#E0484E; --ember:#F07A1A;
  --plum:#7559F2; --steel:#3F68B5; --mist:#C9D6EC;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);
  font:500 18px/1.45 Nunito,ui-rounded,system-ui,sans-serif}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto}
header{display:flex;align-items:baseline;gap:14px;padding:14px 28px 0}
header .chap{font:600 15px Fredoka,ui-rounded,sans-serif;color:var(--soft)}
header .title{font:600 22px Fredoka,ui-rounded,sans-serif}
#stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 20px}
#stage svg{width:100%;height:100%;max-height:100%}
#stage .html{max-width:980px;width:100%}
.sub{margin:0 auto 10px;max-width:1000px;width:calc(100% - 40px);background:var(--paper);
  border:3px solid var(--ink);border-radius:18px;padding:16px 24px;min-height:94px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font:700 clamp(18px,2.1vw,25px)/1.35 Nunito,ui-rounded,sans-serif;box-shadow:0 5px 0 var(--ink)}
.sub code{font:800 .9em ui-monospace,Menlo,monospace;background:var(--sky);padding:1px 7px;border-radius:6px}
.ctrl{display:flex;align-items:center;gap:10px;padding:4px 20px 14px;max-width:1040px;width:100%;margin:0 auto}
button{font:700 15px Nunito,sans-serif;color:var(--ink);background:var(--paper);border:2px solid var(--ink);
  border-radius:12px;padding:7px 14px;cursor:pointer}
button:hover{background:#F3F7FD}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bar{flex:1;display:flex;gap:4px;height:14px;cursor:pointer}
.bar i{flex:1;background:var(--mist);border-radius:7px;position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0;width:0;background:var(--ink);border-radius:7px}
.bar i:hover{background:#B5C5E2}
.count{font:700 14px Nunito;color:var(--soft);min-width:52px;text-align:right}

/* svg vocabulary */
svg text{font-family:Nunito,ui-rounded,sans-serif;fill:var(--ink)}
.h1{font:600 46px Fredoka,ui-rounded,sans-serif}
.h2{font:600 30px Fredoka,ui-rounded,sans-serif}
.lbl{font-weight:800;font-size:17px}
.sm{font-weight:700;font-size:14px;fill:var(--soft)}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.line{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:8 8}
.card{fill:var(--paper);stroke:var(--ink);stroke-width:3}

/* beat reveal */
[data-b]{opacity:0;transition:opacity .5s, transform .5s}
[data-b].show{opacity:1}
[data-hide].gone{opacity:0;transition:opacity .5s}

/* node faces */
.f-sick,.f-sleep{display:none}
[data-mood=sick] .f-happy,[data-mood=sleep] .f-happy{display:none}
[data-mood=sick] .f-sick{display:inline}
[data-mood=sleep] .f-sleep{display:inline}
[data-mood=sleep] .body{fill:#E7D9AE}
.pill{fill:var(--mist);transition:fill .4s}
[data-state=online] .pill{fill:var(--leaf)}
[data-state=offline] .pill{fill:var(--rose)}
[data-state=pending] .pill{fill:var(--sun)}
[data-state=online] .pilltxt,[data-state=offline] .pilltxt{fill:#fff}
.pilltxt{font-weight:800;font-size:13px}
[data-state=""] .pillg{display:none}

/* motion */
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.wave{animation:wave .9s ease-in-out infinite;transform-origin:0 0}
@keyframes fly{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.fly{animation:fly var(--t,2.2s) ease-in-out infinite;animation-delay:var(--d,0s)}
.fly.stopped{animation:none!important;opacity:0!important}
@keyframes once{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
.move.show{animation:once 1.4s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.drawme{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3s ease-out forwards}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop.show{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.zz{animation:zz 2.2s ease-out infinite}
@keyframes ping{0%{opacity:.9;r:8}100%{opacity:0;r:40}}
.ping{animation:ping 1.6s ease-out infinite}

/* html scenes */
.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:start;background:var(--paper);
  border:3px solid var(--ink);border-radius:18px;padding:16px 20px}
.step .n{font:600 30px Fredoka,sans-serif;width:48px;height:48px;border-radius:50%;background:var(--sun);
  border:3px solid var(--ink);display:grid;place-items:center}
.step h3{margin:0 0 2px;font:600 22px Fredoka,sans-serif}
.step p{margin:0;color:var(--soft);font-weight:700}
.step a{color:var(--steel);font-weight:800}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px 26px}
.gloss div{padding:9px 0;border-bottom:2px dashed var(--mist)}
.gloss b{font:600 19px Fredoka,sans-serif;display:block}
.gloss span{color:var(--soft);font-weight:700;font-size:16px}
.html h2{font:600 32px Fredoka,sans-serif;margin:0 0 16px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .drawme{stroke-dashoffset:0}
}
@media (max-width:640px){header{padding:10px 16px 0}.sub{padding:12px 14px}}
</style>
</head>
<body>
<div class="app">
  <header><span class="chap" id="chap"></span><span class="title" id="title"></span></header>
  <main id="stage" aria-live="off"></main>
  <div class="sub" id="sub" aria-live="polite"></div>
  <div class="ctrl">
    <button id="play">Pause</button>
    <button id="prev" aria-label="Previous">◀</button>
    <button id="next" aria-label="Next">▶</button>
    <button id="voice" aria-pressed="false" title="Read the subtitles out loud (V)">Read aloud</button>
    <div class="bar" id="bar"></div>
    <span class="count" id="count"></span>
  </div>
</div>

<script>
/* ---------- drawing helpers ---------- */
const $ = s => document.querySelector(s);
const B = b => b ? ` data-b="${b}"` : '';

function node(x, y, o = {}) {
  const s = o.s || 1, id = o.id ? ` id="${o.id}"` : '';
  const agent = o.agent ? `<g${B(o.agent === true ? 0 : o.agent)} transform="translate(34,-40)">
      <line x1="0" y1="-12" x2="0" y2="-24" class="line"/><circle cx="0" cy="-27" r="4" fill="var(--leaf)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle r="13" fill="var(--leaf)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="-4" cy="-2" r="2.2" fill="#fff"/><circle cx="4" cy="-2" r="2.2" fill="#fff"/>
      <path d="M-4 5 Q0 8 4 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>` : '';
  const pill = o.state !== undefined ? `<g class="pillg" transform="translate(0,-66)"><rect class="pill" x="-42" y="-13" width="84" height="26" rx="13" stroke="var(--ink)" stroke-width="2.5"/>
      <text class="pilltxt" text-anchor="middle" y="5">${o.state}</text></g>` : '';
  return `<g${id} transform="translate(${x},${y}) scale(${s})" data-mood="${o.mood || 'happy'}" data-state="${o.state || ''}"${B(o.b)}>
    <g class="${o.bob === false ? '' : 'bob'}" style="animation-delay:${(o.delay || 0)}s">
    <rect x="-28" y="34" width="14" height="10" rx="3" fill="var(--ink)"/><rect x="14" y="34" width="14" height="10" rx="3" fill="var(--ink)"/>
    <rect class="body" x="-46" y="-36" width="92" height="74" rx="16" fill="${o.color || 'var(--sun)'}" stroke="var(--ink)" stroke-width="3.5"/>
    <rect x="-34" y="20" width="68" height="6" rx="3" fill="var(--ink)" opacity=".18"/>
    <g class="f-happy"><circle cx="-15" cy="-8" r="5.5" fill="var(--ink)"/><circle cx="15" cy="-8" r="5.5" fill="var(--ink)"/>
      <path d="M-11 6 Q0 15 11 6" class="line"/></g>
    <g class="f-sick"><path d="M-20 -13 l10 10 M-10 -13 l-10 10 M10 -13 l10 10 M20 -13 l-10 10" class="line"/>
      <path d="M-11 10 q4 -5 8 0 t8 0" class="line"/></g>
    <g class="f-sleep"><path d="M-21 -7 h12 M9 -7 h12" class="line"/><path d="M-6 9 h12" class="line"/>
      <text class="zz lbl" x="40" y="-30">z</text></g>
    ${o.wave ? `<g transform="translate(46,-4)"><g class="wave"><path d="M0 0 L26 -22" class="line" stroke-width="5"/><circle cx="28" cy="-24" r="7" fill="${o.color || 'var(--sun)'}" stroke="var(--ink)" stroke-width="3"/></g></g>` : ''}
    ${agent}</g>${pill}
    ${o.label ? `<text class="${o.lblClass || 'lbl'}" text-anchor="middle" y="68">${o.label}</text>` : ''}
  </g>`;
}

function manager(x, y, o = {}) {
  const rows = o.rows || [];
  const list = rows.map((r, i) => `<g transform="translate(-44,${-52 + i * 22})"><circle id="${o.id || 'm'}dot${i}" cx="6" cy="0" r="6" fill="${r.c || 'var(--leaf)'}" stroke="var(--ink)" stroke-width="2"/>
     <rect x="18" y="-4" width="${r.w || 54}" height="8" rx="4" fill="var(--mist)"/></g>`).join('');
  return `<g transform="translate(${x},${y}) scale(${o.s || 1})"${B(o.b)}>
    <rect x="-20" y="72" width="40" height="18" fill="var(--ink)"/><rect x="-54" y="88" width="108" height="12" rx="6" fill="var(--ink)"/>
    <rect x="-74" y="-92" width="148" height="168" rx="20" fill="var(--steel)" stroke="var(--ink)" stroke-width="3.5"/>
    <rect x="-58" y="-76" width="116" height="104" rx="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
    ${list || `<circle cx="-18" cy="-30" r="6" fill="var(--ink)"/><circle cx="18" cy="-30" r="6" fill="var(--ink)"/><path d="M-14 -10 Q0 2 14 -10" class="line"/>`}
    <rect x="-40" y="42" width="80" height="16" rx="8" fill="var(--paper)" opacity=".35"/>
    <text text-anchor="middle" y="130" class="lbl">${o.label === undefined ? 'Fleet Manager' : o.label}</text></g>`;
}

function person(x, y, o = {}) {
  return `<g transform="translate(${x},${y})"${B(o.b)}>
    <circle cy="-70" r="28" fill="#F2C9A5" stroke="var(--ink)" stroke-width="3.5"/>
    <path d="M-28 -78 Q-20 -108 6 -100 Q30 -96 28 -76 Q12 -90 -28 -78Z" fill="var(--ink)"/>
    <circle cx="-9" cy="-68" r="3.5" fill="var(--ink)"/><circle cx="9" cy="-68" r="3.5" fill="var(--ink)"/>
    <path d="${o.worried ? 'M-8 -52 Q0 -58 8 -52' : 'M-8 -56 Q0 -50 8 -56'}" class="line" stroke-width="3"/>
    <path d="M-36 40 Q-36 -36 0 -36 Q36 -36 36 40Z" fill="var(--plum)" stroke="var(--ink)" stroke-width="3.5"/>
    <text text-anchor="middle" y="66" class="lbl">${o.label || 'You'}</text></g>`;
}

const heart = (x, y, o = {}) => `<g transform="translate(${x},${y}) scale(1.6)"><path class="fly ${o.cls || ''}" style="--dx:${o.dx / 1.6}px;--dy:${o.dy / 1.6}px;--d:${o.d || 0}s;--t:${o.t || 2.4}s"
  d="M0 6 C-12 -4 -10 -14 -3 -14 C0 -14 0 -11 0 -10 C0 -11 0 -14 3 -14 C10 -14 12 -4 0 6Z" fill="var(--rose)" stroke="var(--ink)" stroke-width="1.6"/></g>`;

function bubble(x, y, w, text, o = {}) {
  const h = o.h || 50, tail = o.tail || 'left';
  const tx = tail === 'left' ? 24 : tail === 'right' ? w - 24 : w / 2;
  const tailPath = o.tail === 'none' ? '' : `<path d="M${tx - 10} ${h - 2} L${tx + (tail === 'right' ? 14 : -14)} ${h + 18} L${tx + 10} ${h - 2}" fill="var(--paper)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><rect x="${tx - 12}" y="${h - 6}" width="24" height="5" fill="var(--paper)"/>`;
  return `<g transform="translate(${x},${y})"${B(o.b)} class="${o.cls || ''}">
    <rect width="${w}" height="${h}" rx="16" class="card"/>${tailPath}
    <text x="${w / 2}" y="${h / 2 + 6}" text-anchor="middle" class="${o.tc || 'lbl'}">${text}</text></g>`;
}

function prom(x, y, o = {}) {   /* Prometheus: an orange notebook-keeper with a little flame */
  return `<g transform="translate(${x},${y}) scale(${o.s || 1})"${B(o.b)}><g class="bob">
    <path d="M0 -112 C-14 -96 -10 -86 0 -80 C10 -86 14 -96 0 -112Z" fill="var(--sun)" stroke="var(--ink)" stroke-width="3"/>
    <rect x="-50" y="-80" width="100" height="120" rx="18" fill="var(--ember)" stroke="var(--ink)" stroke-width="3.5"/>
    <circle cx="-16" cy="-46" r="5.5" fill="var(--ink)"/><circle cx="16" cy="-46" r="5.5" fill="var(--ink)"/><path d="M-10 -32 Q0 -24 10 -32" class="line"/>
    <rect x="-34" y="-14" width="68" height="44" rx="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
    <path d="M-26 -2 h40 M-26 8 h50 M-26 18 h32" stroke="var(--mist)" stroke-width="4" stroke-linecap="round"/></g>
    <text text-anchor="middle" y="70" class="lbl">${o.label === undefined ? 'Prometheus' : o.label}</text></g>`;
}

function tv(x, y, w, h, inner, o = {}) {   /* Grafana screen */
  return `<g transform="translate(${x},${y})"${B(o.b)}>
    <rect x="${w / 2 - 14}" y="${h}" width="28" height="22" fill="var(--ink)"/><rect x="${w / 2 - 60}" y="${h + 20}" width="120" height="12" rx="6" fill="var(--ink)"/>
    <rect width="${w}" height="${h}" rx="18" fill="var(--plum)" stroke="var(--ink)" stroke-width="3.5"/>
    <rect x="14" y="14" width="${w - 28}" height="${h - 28}" rx="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>${inner}
    <text x="${w / 2}" y="${h + 62}" text-anchor="middle" class="lbl">${o.label || 'Grafana'}</text></g>`;
}

function tracker(x, y, o = {}) {   /* node_exporter band */
  return `<g transform="translate(${x},${y})"${B(o.b)}>
    <rect x="-30" y="-15" width="60" height="30" rx="9" fill="var(--ink)"/>
    <text class="mono" x="0" y="6" text-anchor="middle" style="fill:#7CF0B5;font-size:15px" ${o.id ? `id="${o.id}"` : ''}>${o.v || '34%'}</text></g>`;
}

/* ---------- scenes ---------- */
const scenes = [
{ chap: 'Start', title: 'What is this project, actually?', svg: () => `
  <text x="500" y="110" text-anchor="middle" class="h1">Let's start from zero.</text>
  ${node(500, 330, { s: 2.3, wave: true })}`,
  beats: [
    { say: "Hi! This is a short story about your project. You don't need to know anything yet. Not Linux, not Docker, not Prometheus." },
    { say: "By the end, you'll be able to explain every box in it to someone else." },
  ]},

{ chap: 'Chapter 1', title: 'Meet a node', svg: () => `
  ${node(250, 290, { s: 2.2, label: '' })}
  <text x="250" y="450" text-anchor="middle" class="h2">a node</text>
  ${[0,1,2,3].map(r => [0,1,2].map(c => node(570 + c * 140, 110 + r * 115, { s: .62, b: 3, delay: (r + c) * .2, bob: true })).join('')).join('')}
  <text x="710" y="535" text-anchor="middle" class="sm" data-b="3">a fleet = a whole bunch of nodes</text>`,
  beats: [
    { say: "This is a <b>node</b>. It's just one computer. That's all the word means." },
    { say: "It runs <b>Linux</b>, an operating system like Windows, except it's free and it's what almost every server in the world runs." },
    { say: "A company doesn't have one of these. It has dozens, or thousands. That group is called a <b>fleet</b>." },
  ]},

{ chap: 'Chapter 1', title: 'The problem', svg: () => `
  ${person(150, 380, { worried: true })}
  ${bubble(40, 70, 290, 'Which ones are switched on?', { b: 2, tail: 'none' })}
  ${bubble(40, 140, 290, 'Which ones are struggling?', { b: 3, tail: 'none' })}
  ${bubble(40, 210, 290, 'How do I check all of them?', { b: 4 })}
  ${node(520, 150, { s: .8 })}${node(670, 150, { s: .8, mood: 'sleep' })}${node(820, 150, { s: .8 })}
  ${node(520, 310, { s: .8, mood: 'sick' })}${node(670, 310, { s: .8 })}${node(820, 310, { s: .8 })}
  ${node(595, 460, { s: .8 })}${node(745, 460, { s: .8, mood: 'sick' })}`,
  beats: [
    { say: "Now imagine you're in charge of all these computers. They're in a data centre, maybe in another city. You can't walk up to each one." },
    { say: "Some are switched off." },
    { say: "Some are sick: too busy, out of memory, disk nearly full." },
    { say: "And you need a way to check on all of them without logging into each one by hand. That's the problem this project solves." },
  ]},

{ chap: 'Chapter 2', title: 'One boss, many helpers', svg: () => `
  ${manager(190, 260, { b: 1 })}
  ${[[560,150],[730,150],[900,150],[560,380],[730,380],[900,380]].map(([x,y], i) => `
    <path d="M270 ${230 + (i % 3) * 20} Q${(270 + x) / 2} ${y - 80} ${x - 10} ${y - 50}" class="line dash" opacity=".5" data-b="3"/>
    ${node(x, y, { s: .8, agent: 2, delay: i * .3 })}`).join('')}
  <g data-b="2"><text x="965" y="60" class="lbl" text-anchor="end">the agent</text><path d="M940 70 Q952 88 934 104" class="line" stroke-width="2.5"/></g>`,
  beats: [
    { say: "So we build a boss: the <b>Fleet Manager</b>. It's a program with a website where you can see every node in one place." },
    { say: "Then on every node we install a tiny helper program called the <b>agent</b>. That little green guy." },
    { say: "The agents talk to the boss. The boss never has to log in to anything." },
    { say: "That's literally the assignment: build the boss and the helper. The rest of this story is just the details of how they talk." },
  ]},

{ chap: 'Chapter 3', title: 'Joining the fleet', svg: () => `
  ${manager(180, 260)}
  ${node(810, 300, { s: 1.4, agent: 3, id: 'newbie', state: '' })}
  <g class="move" data-b="2" style="--dx:520px;--dy:-40px"><g transform="translate(240,170)">
    <rect x="-46" y="-26" width="92" height="52" rx="8" fill="var(--sun)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="-46" cy="0" r="9" fill="var(--sky)" stroke="var(--ink)" stroke-width="3"/><circle cx="46" cy="0" r="9" fill="var(--sky)" stroke="var(--ink)" stroke-width="3"/>
    <text text-anchor="middle" y="6" class="lbl">invite</text></g></g>
  <g data-b="1" data-hide="2"><g transform="translate(240,170)">
    <rect x="-46" y="-26" width="92" height="52" rx="8" fill="var(--sun)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="-46" cy="0" r="9" fill="var(--sky)" stroke="var(--ink)" stroke-width="3"/><circle cx="46" cy="0" r="9" fill="var(--sky)" stroke="var(--ink)" stroke-width="3"/>
    <text text-anchor="middle" y="6" class="lbl">invite</text></g></g>
  <g class="move" data-b="3" style="--dx:540px;--dy:120px"><g transform="translate(250,250)">
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="-18" cy="-4" r="10" fill="var(--steel)"/><rect x="0" y="-12" width="28" height="6" rx="3" fill="var(--mist)"/><rect x="0" y="0" width="22" height="6" rx="3" fill="var(--mist)"/>
    <text text-anchor="middle" y="22" class="sm" style="font-size:11px">ID card</text></g></g>
  <g data-b="4"><rect x="640" y="460" width="330" height="56" rx="14" class="card"/><text x="805" y="494" text-anchor="middle" class="lbl">invite code: expires fast, limited uses</text></g>`,
  beats: [
    { say: "How does a new computer join? Step one: in the Fleet Manager's website you click <b>Onboard</b>, and it gives you a one-time invite code." },
    { say: "Step two: on the new computer, you run one install command with that code. It installs the agent." },
    { say: "Step three: the agent shows the code to the boss. The boss checks it and hands back a permanent ID card. The node is now part of the fleet.", on: () => setNode('newbie', { state: 'pending' }) },
    { say: "Invite codes expire quickly and can only be used a few times, so a leaked code isn't a disaster. In the code these are called <b>tokens</b>." },
  ]},

{ chap: 'Chapter 4', title: 'Heartbeats', svg: () => heartbeatScene(),
  beats: [
    { say: "Every 15 seconds, each agent sends the boss a tiny message: \"I'm still here.\" This is called a <b>heartbeat</b>." },
    { say: "The boss writes down the last time it heard from each node. Heard from recently? It's marked <b>online</b>.", on: () => ['n0','n1','n2'].forEach(n => setNode(n, { state: 'online' })) },
  ]},

function heartbeatScene(withTimer) {
  const ys = [130, 290, 450];
  return `${manager(190, 270, { rows: [{}, {}, {}], b: 0 })}
    ${ys.map((y, i) => node(800, y, { s: .85, agent: true, id: 'n' + i, state: withTimer ? 'online' : '', delay: i * .3 })
       + [0, 1].map(k => heart(740, y - 10, { dx: -460, dy: 250 - y - 30 + i * 22, d: i * .7 + k * 1.3, t: 2.6, cls: 'hb' + i })).join('')).join('')}`;
}

/* ---------- engine ---------- */
const stage = $('#stage'), sub = $('#sub');
let si = 0, bi = 0, playing = !matchMedia('(prefers-reduced-motion:reduce)').matches, narrate = false, tick = null, timers = [];
const flat = scenes.flatMap((s, i) => s.beats.map((_, j) => [i, j]));

function setNode(id, { state, mood } = {}) {
  const g = document.getElementById(id); if (!g) return;
  if (mood) g.dataset.mood = mood;
  if (state !== undefined) { g.dataset.state = state; const t = g.querySelector('.pilltxt'); if (t) t.textContent = state; }
}
function liveNumbers() {
  const rnd = (a, b) => Math.round(a + Math.random() * (b - a));
  const t = setInterval(() => {
    const c = rnd(22, 58); const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('cpu', c + '%'); set('cpuv', 'CPU ' + c + '%'); set('mem', rnd(58, 64) + '%'); set('dsk', '78%'); set('net', (Math.random() * 3 + .5).toFixed(1) + ' MB/s');
  }, 1100); timers.push(t);
}

function render(i) {
  timers.forEach(clearInterval); timers = [];
  const s = scenes[i];
  stage.innerHTML = s.html ? s.html() : `<svg viewBox="0 0 1000 560" role="img" aria-label="${s.title}">${s.svg()}</svg>`;
  $('#chap').textContent = s.chap; $('#title').textContent = s.title;
}
function applyBeat(upTo) {
  stage.querySelectorAll('[data-b]').forEach(el => el.classList.toggle('show', +el.dataset.b <= upTo + 1));
  stage.querySelectorAll('[data-hide]').forEach(el => el.classList.toggle('gone', +el.dataset.hide <= upTo + 1));
}
function go(ni, nj, replay) {
  clearTimeout(tick); window.speechSynthesis?.cancel();
  const changed = ni !== si || replay;
  if (changed) render(ni);
  si = ni; bi = nj;
  // run every beat's hook up to here when jumping into a scene, so state matches
  if (changed) for (let k = 0; k < nj; k++) scenes[si].beats[k].on?.();
  applyBeat(bi);
  const beat = scenes[si].beats[bi];
  sub.innerHTML = `<span>${beat.say}</span>`;
  beat.on?.();
  updateBar();
  schedule(beat.say);
}
function dur(html) { const w = html.replace(/<[^>]+>/g, '').split(/\s+/).length; return Math.max(3600, w * 380 + 1400); }
function schedule(html) {
  if (!playing) return;
  const ms = dur(html);
  if (narrate && 'speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(html.replace(/<[^>]+>/g, '').replace(/df -h/g, 'D F').replace(/free -h/g, 'free').replace(/uname -a/g, 'you-name'));
    u.rate = 1; let done = false;
    const fin = () => { if (done) return; done = true; tick = setTimeout(step, 700); };
    u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
    tick = setTimeout(fin, ms * 2.2);
  } else tick = setTimeout(step, ms);
}
function pos() { return flat.findIndex(([a, b]) => a === si && b === bi); }
function step(d = 1) {
  const p = pos() + d;
  if (p >= flat.length) { setPlaying(false); return; }
  if (p < 0) return;
  go(...flat[p]);
}
function setPlaying(v) { playing = v; $('#play').textContent = v ? 'Pause' : 'Play'; if (v) { if (pos() === flat.length - 1) go(0, 0, true); else go(si, bi); } else { clearTimeout(tick); window.speechSynthesis?.cancel(); } }
function updateBar() {
  const bar = $('#bar');
  if (!bar.children.length) scenes.forEach((s, i) => { const el = document.createElement('i'); el.title = s.title; el.innerHTML = '<b></b>'; el.onclick = () => go(i, 0, true); bar.append(el); });
  [...bar.children].forEach((el, i) => el.firstChild.style.width = i < si ? '100%' : i > si ? '0' : ((bi + 1) / scenes[i].beats.length * 100) + '%');
  $('#count').textContent = `${si + 1} / ${scenes.length}`;
}

$('#play').onclick = () => setPlaying(!playing);
$('#next').onclick = () => step(1);
$('#prev').onclick = () => { const p = pos(); if (p > 0) { const [a, b] = flat[p - 1]; go(a, b, true); } };
$('#voice').onclick = () => { narrate = !narrate; $('#voice').setAttribute('aria-pressed', narrate); go(si, bi); };
addEventListener('keydown', e => {
  if (e.target.closest('a')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') $('#prev').click();
  else if (e.key.toLowerCase() === 'v') $('#voice').click();
});
$('#play').textContent = playing ? 'Pause' : 'Play';
const h = /s=(\d+)(?:&b=(\d+))?/.exec(location.hash);
if (h) { playing = !/paused/.test(location.hash); $('#play').textContent = playing ? 'Pause' : 'Play';
  const i = Math.min(scenes.length - 1, +h[1] - 1), j = Math.min(scenes[i].beats.length - 1, +(h[2] || 1) - 1); render(i); si = i; go(i, j, true); }
else { render(0); go(0, 0); }
</script>
