global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fleetmgr
    static_configs:
      - targets: ["fleetmgr:8080"]
  - job_name: fleet-nodes
    http_sd_configs:
      - url: http://fleetmgr:8080/api/v1/prometheus/sd
        refresh_interval: 15s
  - job_name: demo-node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          hostname: demo
